<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Music Ducker</title>
  <style>
    :root { color-scheme: light dark; font: 14px/1.4 system-ui, sans-serif; }
    body { margin: 0; width: 320px; }
    #root { padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    p.hint { margin: 0 0 10px; opacity: .7; }
    p.error { margin: 0 0 10px; color: #c62828; }
    ul { list-style: none; margin: 0; padding: 0; }
    li, .tab { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
    li + li { border-top: 1px solid #8884; }
    .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    img { width: 16px; height: 16px; }
    button { font: inherit; padding: 4px 10px; cursor: pointer; }
    label { display: block; margin-top: 12px; }
    input[type=range] { width: 100%; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.jsx"></script>
</body>
</html>
